# Travis CI — full replacement for the GitHub Actions workflows
# (.github/workflows/ci.yml, release.yml, pages.yml were removed in the same
# change; owner order 2026-11-27: full Travis).
#
# The job set mirrors what Actions ran, job for job, with the same tool
# versions (Go 1.27, Bun 1.4.2) and the same commands:
#
#   Actions job        Travis job              Notes
#   -----------------  ----------------------  -------------------------------
#   lint               Lint                    golangci-lint installed from
#                                              the pinned release instead of
#                                              the action wrapper; same args.
#   changeset          Changelog fragment      PR title is fetched from the
#                                              GitHub API (Travis does not
#                                              expose it); the check itself
#                                              is the same script.
#   test               Test                    E2E still gated on
#                                              E2E_DATABASE_URL being set.
#   windows-service    Service tests (Windows) os: windows, Bun via npm
#                                              (the Actions runner used the
#                                              Bun setup action).
#   race               Race detector
#   integration        Integration tests
#   docker             Build Docker image      plain docker build instead of
#                                              build-push-action; same
#                                              Dockerfile, same PGO assert.
#   cross              Cross-compile
#   pages build+deploy Site                    build + every assertion kept;
#                                              deploy via the Travis Pages
#                                              provider to the gh-pages
#                                              branch (Actions used the
#                                              Pages artifact flow). The
#                                              Actions paths filter has no
#                                              Travis equivalent, so the
#                                              site job runs on every build:
#                                              strictly more verification.
#   release (main)     Release image (main)    same GHCR tags that
#   release (tag)      Release (tag)           metadata-action produced:
#                                              latest+branch+sha on main,
#                                              tag+sha on tags. The GitHub
#                                              Release is created via the
#                                              API with generated notes, as
#                                              action-gh-release did.
#
# Actions-only mechanics with no Travis equivalent, accepted in the move:
# per-ref concurrency cancellation (Travis auto-cancel is a repo setting),
# the Actions job timeouts (the plan's job limit applies), and the GHA
# cache (Travis directory caches below are performance-only).
#
# Secrets (GHCR_USERNAME, GHCR_TOKEN, GITHUB_TOKEN) are Travis repo env
# vars, set through the Travis API — never in this file.

os: linux
dist: jammy
language: go
go: "1.27"

# Full history: the lint baseline, the changeset diff and `make cross`
# all resolve merge bases / parent commits a shallow clone does not have.
git:
  depth: false

notifications:
  email: false

# Bun is pinned to the version Actions used (setup-bun 1.4.2).
before_install:
  - curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
  - export BUN_INSTALL="$HOME/.bun"
  - export PATH="$BUN_INSTALL/bin:$PATH"

cache:
  directories:
    - $HOME/.cache/go-build
    - $HOME/.bun/install/cache

jobs:
  include:
    # ------------------------------------------------------------------
    # Lint — mirrors ci.yml lint: golangci-lint ratchet on the diff,
    # govulncheck, oxlint, actionlint.
    - name: Lint
      script:
        # golangci-lint reports an absent web/dist as a typecheck failure;
        # the linters read source, so a one-file stub is enough.
        - mkdir -p web/dist && printf '<!doctype html><title>stub</title>' > web/dist/index.html
        - |
          set -euo pipefail
          if [ "$TRAVIS_PULL_REQUEST" != "false" ]; then
            git fetch --no-tags origin "$TRAVIS_BRANCH"
            REV="FETCH_HEAD"
          else
            REV="HEAD~1"
          fi
          SHA="$(git rev-parse --verify "${REV}^{commit}")" || {
            echo "error: lint baseline '${REV}' does not resolve."
            exit 1
          }
          echo "lint baseline: ${REV} -> ${SHA}"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run --timeout 10m --new-from-rev="$SHA" ./...
        - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        - (cd web && bun install --frozen-lockfile)
        - (cd web && bunx oxlint --deny-warnings)
        # With the Actions workflows gone this is a guard for their return:
        # it lints any workflow files that exist and passes on none.
        - |
          if ls .github/workflows/*.yml >/dev/null 2>&1; then
            go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          else
            echo "no GitHub workflow files to lint"
          fi

    # ------------------------------------------------------------------
    # Changelog fragment — mirrors ci.yml changeset (PR builds only):
    # a PR must carry .changes/<pr>-<slug>.md and must not edit
    # CHANGELOG.md (AGENTS.md §7.6).
    - name: Changelog fragment
      if: type = pull_request
      script:
        - |
          set -euo pipefail
          # Travis does not expose the PR title; fetch it from the API.
          # Without the repo token (fork PRs) the title stays empty and the
          # exemption below simply never matches — the strict direction.
          PR_TITLE=""
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            PR_TITLE="$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/RMz17X/AxonRouter-Go/pulls/$TRAVIS_PULL_REQUEST" \
              | jq -r '.title // ""' || true)"
          fi
          BASE_REF="$TRAVIS_BRANCH"
          git fetch --no-tags origin "${BASE_REF}"
          BASE="$(git rev-parse --verify 'FETCH_HEAD^{commit}')" || {
            echo "error: cannot resolve the merge base for the diff."
            exit 1
          }
          CHANGED="$(git diff --name-only "${BASE}...HEAD")"
          echo "changed files:"
          printf '%s\n' "${CHANGED}"
          echo
          if printf '%s\n' "${CHANGED}" | grep -qx 'CHANGELOG.md'; then
            echo "error: this PR edits CHANGELOG.md."
            echo "That file is written only by 'make changelog-merge' at release"
            echo "time. Move the entry into a new fragment instead:"
            echo "  .changes/<pr-number>-<slug>.md"
            echo "See .changes/README.md and AGENTS.md §7.6."
            exit 1
          fi
          case "${PR_TITLE}" in
            chore:*|\[ImgBot\]*)
              echo "exempt title, no fragment required: ${PR_TITLE}"
              exit 0
              ;;
          esac
          DOCS_ONLY=true
          while IFS= read -r f; do
            [ -z "${f}" ] && continue
            case "${f}" in
              docs/*|*.md) ;;
              *) DOCS_ONLY=false; break ;;
            esac
          done <<< "${CHANGED}"
          if [ "${DOCS_ONLY}" = true ]; then
            echo "documentation-only change, no fragment required"
            exit 0
          fi
          if ! printf '%s\n' "${CHANGED}" | grep -qE '^\.changes/[^/]+\.md$'; then
            echo "error: no changelog fragment in .changes/."
            echo "Add one named after this PR, containing the entry as it would"
            echo "appear under ## [Unreleased]:"
            echo "  .changes/<pr-number>-<slug>.md"
            echo "See .changes/README.md and AGENTS.md §7.6."
            exit 1
          fi
          echo "changelog fragment present."

    # ------------------------------------------------------------------
    # Test — mirrors ci.yml test.
    - name: Test
      script:
        - (cd web && bun install --frozen-lockfile && bun run build)
        - (cd web && bun test src scripts)
        - (cd web && bun run ratchet:svelte)
        - go vet ./...
        - go test ./... -v
        - go build -ldflags="-s -w" -o /tmp/axonrouter-go ./cmd/axonrouter-go/
        - |
          go version -m /tmp/axonrouter-go | grep -q -- '-pgo=' || {
            echo "error: PGO profile not applied to the release binary."
            echo "Check that cmd/axonrouter-go/default.pgo is committed and that"
            echo "no build step passes -pgo=off."
            exit 1
          }
          go version -m /tmp/axonrouter-go | grep -- '-pgo='
        - go build -o axonrouter-go ./cmd/axonrouter-go/
        - (cd web && bunx playwright install --with-deps chromium)
        # Owner rule (2026-11-06): the E2E suite skips when no database is
        # configured; set E2E_DATABASE_URL as a Travis repo env var to a
        # reachable scratch PostgreSQL DSN to enable it.
        - |
          if [ -n "${E2E_DATABASE_URL:-}" ]; then
            (cd web && DATABASE_URL="$E2E_DATABASE_URL" bun run e2e)
          else
            echo "E2E skipped: E2E_DATABASE_URL is not configured"
          fi

    # ------------------------------------------------------------------
    # Service tests (Windows) — mirrors ci.yml windows-service, scoped
    # to the one package full of runtime.GOOS branches.
    - name: Service tests (Windows)
      os: windows
      before_install:
        # The Actions runner used the Bun setup action; on Travis Windows
        # the pinned Bun comes from the npm package instead.
        - npm install -g bun@1.4.2
      script:
        - (cd web && bun install --frozen-lockfile && bun run build)
        - go test -count=1 ./internal/service/

    # ------------------------------------------------------------------
    # Race detector — mirrors ci.yml race.
    - name: Race detector
      script:
        - (cd web && bun install --frozen-lockfile && bun run build)
        - go test -race -count=1 -timeout 10m ./...

    # ------------------------------------------------------------------
    # Integration tests — mirrors ci.yml integration. Owner rule
    # (2026-11-06): the suite skips itself when no database is configured
    # (dbtest.ErrNoDatabase); CI provisions none.
    - name: Integration tests
      script:
        - (cd web && bun install --frozen-lockfile && bun run build)
        - go vet -tags=integration ./internal/integration/...
        - go test -tags=integration -race -count=1 -timeout 10m ./internal/integration/... -v

    # ------------------------------------------------------------------
    # Build Docker image (verify only) — mirrors ci.yml docker: builds
    # the real Dockerfile on every build, pushes nothing, and asserts
    # the PGO profile survived the Docker build context.
    - name: Build Docker image (verify only)
      services:
        - docker
      env:
        - DOCKER_BUILDKIT=1
      script:
        - docker build -t axonrouter-go:ci .
        - |
          set -euo pipefail
          cid=$(docker create axonrouter-go:ci)
          docker cp "$cid":/usr/local/bin/axonrouter-go /tmp/from-image
          docker rm "$cid" >/dev/null
          go version -m /tmp/from-image | grep -q -- '-pgo=' || {
            echo "error: PGO profile missing inside the Docker image."
            echo "Check .dockerignore for an entry that would drop"
            echo "cmd/axonrouter-go/default.pgo from the build context."
            exit 1
          }
          go version -m /tmp/from-image | grep -- '-pgo='

    # ------------------------------------------------------------------
    # Cross-compile — mirrors ci.yml cross: the release build itself,
    # with the artifact-architecture and SHA256SUMS assertions.
    - name: Cross-compile
      script:
        - |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod download all; then
              echo "module graph cached on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "error: go mod download failed 3 times; the proxy is unreachable."
              echo "This is infrastructure, not a defect in the diff — re-run the job."
              exit 1
            fi
            echo "attempt ${attempt} failed (transient proxy error); retrying in 5s"
            sleep 5
          done
        - make cross
        - |
          set -euo pipefail
          fail=0
          check() {
            path="$1"; name="$2"; want="$3"
            if [ ! -f "$path" ]; then
              echo "error: $path was not produced"
              fail=1
              return
            fi
            got="$(file -b "$path")"
            case "$got" in
              *"$want"*) echo "ok   $name: $got" ;;
              *)
                echo "error: $name does not look like $want"
                echo "  file: $got"
                fail=1
                ;;
            esac
          }
          check axonrouter-go-linux-amd64        linux/amd64   "x86-64"
          check axonrouter-go-linux-arm64        linux/arm64   "aarch64"
          check axonrouter-go-darwin-amd64       darwin/amd64  "Mach-O 64-bit x86_64"
          check axonrouter-go-darwin-arm64       darwin/arm64  "Mach-O 64-bit arm64"
          check axonrouter-go-windows-amd64.exe  windows/amd64 "PE32+"
          exit "$fail"
        - |
          set -euo pipefail
          for f in axonrouter-go-linux-amd64 axonrouter-go-linux-arm64 \
                   axonrouter-go-darwin-amd64 axonrouter-go-darwin-arm64 \
                   axonrouter-go-windows-amd64.exe; do
            grep -q "  $f\$" SHA256SUMS.txt || {
              echo "error: SHA256SUMS.txt has no entry for $f"
              exit 1
            }
          done
          echo "SHA256SUMS.txt covers all five artifacts:"
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

    # ------------------------------------------------------------------
    # Site — mirrors pages.yml: the sitegen test suite, generation, and
    # every assertion the Actions workflow guarded the deploy with.
    # Deploy (below) publishes _site to the gh-pages branch on main
    # pushes only; providers never run on PR builds.
    - name: Site
      script:
        - go test ./tools/sitegen/...
        - go run ./tools/sitegen -out _site
        - |
          set -euo pipefail
          for f in _site/tg.html _site/tg/index.html; do
            test -f "$f" || { echo "error: $f was not generated"; exit 1; }
            grep -q 't\.me/' "$f" || { echo "error: $f has no invite link"; exit 1; }
            grep -q 'http-equiv="refresh"' "$f" || { echo "error: $f has no meta refresh"; exit 1; }
          done
          grep -q 't\.me/' site/tg.html || {
            echo "error: site/tg.html holds no invite link; update it when the group rotates."
            exit 1
          }
          echo "redirect ok: $(grep -o 'https://t\.me/[^"]*' site/tg.html | head -1)"
        - |
          set -euo pipefail
          for f in _site/index.html _site/style.css _site/tg.html _site/tg/index.html; do
            test -f "$f" || { echo "error: $f missing from the site output"; exit 1; }
          done
          grep -q 'href="style.css"' _site/index.html || {
            echo "error: index.html does not link the stylesheet"
            exit 1
          }
        - |
          set -euo pipefail
          test -f _site/search-index.json || {
            echo "error: _site/search-index.json missing; the wiki search reads it"
            exit 1
          }
          count=$(find _site -maxdepth 1 -name '*.html' | wc -l)
          [ "$count" -gt 1 ] || {
            echo "error: only the project page was generated; the wiki produced no pages"
            exit 1
          }
          dead=0
          while read -r page link; do
            [ -n "$link" ] || continue
            [ -f "_site/$link" ] || { echo "error: $page links to missing $link"; dead=1; }
          done < <(
            for page in _site/*.html; do
              grep -o 'href="[a-z][a-z0-9-]*\.html"' "$page" |
                sed "s|href=\"||;s|\"$||;s|^|$page |"
            done
          )
          [ "$dead" -eq 0 ] || exit 1
          grep -q '"text":"' _site/search-index.json || {
            echo "error: search-index.json has no body text; search cannot reach prose"
            exit 1
          }
          while IFS= read -r anchor; do
            grep -q "id=\"$anchor\"" _site/*.html || {
              echo "error: index anchor $anchor is not published by any page"
              exit 1
            }
          done < <(grep -o '"anchor":"[^"]*"' _site/search-index.json | sed 's/"anchor":"//;s/"//')
          leaked=$(find _site -iname '*before*' | wc -l)
          [ "$leaked" -eq 0 ] || {
            echo "error: $leaked before-screenshot(s) were published; the gallery excludes them"
            exit 1
          }
        - |
          set -euo pipefail
          nav_missing=0
          for page in _site/*.html; do
            case "$(basename "$page")" in tg.html) continue ;; esac
            grep -q 'id="nav-open"' "$page" || { echo "error: $page has no Menu button; phone readers cannot navigate"; nav_missing=1; }
            grep -q 'aria-controls="wiki-side"' "$page" || { echo "error: $page Menu button does not name the sheet it opens"; nav_missing=1; }
            grep -q 'id="wiki-side"' "$page" || { echo "error: $page has no sidebar id"; nav_missing=1; }
          done
          [ "$nav_missing" -eq 0 ] || exit 1
          tables=$(grep -o '<table>' _site/*.html | wc -l)
          wrappers=$(grep -o '<div data-table-scroll>' _site/*.html | wc -l)
          [ "$wrappers" -eq "$tables" ] || {
            echo "error: $tables tables but $wrappers scroll wrappers; a wide table will widen the page"
            exit 1
          }
          imgs=$(grep -o '<img' _site/*.html | wc -l)
          lazy=$(grep -o 'loading="lazy"' _site/*.html | wc -l)
          [ "$lazy" -eq "$imgs" ] || {
            echo "error: $imgs images but only $lazy are lazy; a screenshot page loads them all before it is usable"
            exit 1
          }
          sized=0
          for page in _site/*.html; do
            case "$(basename "$page")" in tg.html) continue ;; esac
            while IFS= read -r img; do
              case "$img" in *width=*height=*) sized=$((sized+1)) ;; esac
            done < <(grep -o '<img[^>]*>' "$page")
          done
          [ "$sized" -eq "$imgs" ] || {
            echo "error: $imgs images but $sized carry width and height; the rest reflow the text as they load"
            exit 1
          }
          for page in _site/*.html; do
            case "$(basename "$page")" in tg.html) continue ;; esac
            markup=$(sed '/<style>/,/<\/style>/d' "$page")
            headings=$(printf '%s' "$markup" | grep -o 'class="wiki-group-title"' | wc -l)
            [ "$headings" -eq 4 ] || {
              echo "error: $page has $headings sidebar section headings, want 4"
              exit 1
            }
          done
          if [ -f _site/team.html ]; then
            cards=$(grep -o 'class="contrib-card' _site/team.html | wc -l)
            [ "$cards" -eq 24 ] || {
              echo "error: team page has $cards contributor cards, want 24 (owner + 23)"
              exit 1
            }
            owners=$(grep -o 'contrib-card owner' _site/team.html | wc -l)
            [ "$owners" -eq 1 ] || {
              echo "error: team page has $owners owner cards, want exactly 1"
              exit 1
            }
            links=$(grep -o 'href="https://github.com/[a-zA-Z0-9-]*"' _site/team.html | wc -l)
            [ "$links" -eq 24 ] || {
              echo "error: team page has $links GitHub profile links, want 24"
              exit 1
            }
            avatars=$(grep -o 'avatars.githubusercontent.com' _site/team.html | wc -l)
            lazy_avatars=$(grep -o 'loading="lazy"' _site/team.html | wc -l)
            [ "$lazy_avatars" -eq "$avatars" ] || {
              echo "error: $avatars avatars but $lazy_avatars are lazy"
              exit 1
            }
            echo "team page ok: $cards cards ($owners owner), $links profile links, $avatars lazy avatars"
          fi
          echo "wiki ok: $count pages, search index present, no dead links, anchors valid, no before-shots, nav disclosure on every page, $tables tables wrapped, $imgs images lazy and sized, 4 sidebar sections on every page"
      deploy:
        provider: pages
        strategy: git
        github_token: $GITHUB_TOKEN
        local_dir: _site
        target_branch: gh-pages
        keep_history: true
        on:
          branch: main

    # ------------------------------------------------------------------
    # Release image (main) — mirrors release.yml on a main push: cross
    # binaries, then the multi-arch image pushed to GHCR with the tags
    # metadata-action produced (latest + branch + short sha). No GitHub
    # Release on a branch push — exactly as Actions behaved.
    - name: Release image (main)
      if: type = push AND branch = main AND tag IS blank
      services:
        - docker
      env:
        - DOCKER_BUILDKIT=1
      script:
        - |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod download all; then
              echo "module graph cached on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed; retrying in 5s"
            sleep 5
          done
          exit 1
        - make cross
        - docker run --privileged --rm tonistiigi/binfmt --install all
        - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
        - |
          set -euo pipefail
          IMAGE="ghcr.io/rmz17x/axonrouter-go"
          SHORT="$(git rev-parse --short HEAD)"
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f Dockerfile.release --push \
            -t "$IMAGE:latest" -t "$IMAGE:main" -t "$IMAGE:sha-$SHORT" \
            --label org.opencontainers.image.source=https://github.com/RMz17X/AxonRouter-Go \
            --label org.opencontainers.image.description="AxonRouter-Go unified container image" \
            --label org.opencontainers.image.licenses=MIT \
            .

    # ------------------------------------------------------------------
    # Release (tag) — mirrors release.yml on a v* tag: same image with
    # the tag + short-sha tags, plus the GitHub Release carrying the
    # five binaries and SHA256SUMS.txt, with generated release notes
    # and prerelease when the tag contains a dash — the exact semantics
    # of action-gh-release in the old workflow.
    - name: Release (tag)
      if: tag IS present
      services:
        - docker
      env:
        - DOCKER_BUILDKIT=1
      script:
        - |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod download all; then
              echo "module graph cached on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed; retrying in 5s"
            sleep 5
          done
          exit 1
        - make cross
        - docker run --privileged --rm tonistiigi/binfmt --install all
        - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
        - |
          set -euo pipefail
          IMAGE="ghcr.io/rmz17x/axonrouter-go"
          SHORT="$(git rev-parse --short HEAD)"
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f Dockerfile.release --push \
            -t "$IMAGE:$TRAVIS_TAG" -t "$IMAGE:sha-$SHORT" \
            --label org.opencontainers.image.source=https://github.com/RMz17X/AxonRouter-Go \
            --label org.opencontainers.image.description="AxonRouter-Go unified container image" \
            --label org.opencontainers.image.licenses=MIT \
            .
        - |
          set -euo pipefail
          API="https://api.github.com/repos/RMz17X/AxonRouter-Go"
          PRERELEASE=false
          case "$TRAVIS_TAG" in *-*) PRERELEASE=true ;; esac
          RESP="$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"$TRAVIS_TAG\",\"name\":\"$TRAVIS_TAG\",\"generate_release_notes\":true,\"prerelease\":$PRERELEASE}" \
            "$API/releases")"
          UPLOAD="$(printf '%s' "$RESP" | jq -r '.upload_url // empty' | sed 's/{.*}//')"
          if [ -z "$UPLOAD" ]; then
            ID="$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$API/releases/tags/$TRAVIS_TAG" | jq -r '.id // empty')"
            if [ -z "$ID" ]; then
              echo "error: GitHub Release creation failed:"
              printf '%s' "$RESP" | head -c 400
              exit 1
            fi
            UPLOAD="$API/releases/$ID/assets"
          fi
          for f in axonrouter-go-linux-amd64 axonrouter-go-linux-arm64 \
                   axonrouter-go-darwin-amd64 axonrouter-go-darwin-arm64 \
                   axonrouter-go-windows-amd64.exe SHA256SUMS.txt; do
            curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
              -H 'Content-Type: application/octet-stream' \
              --data-binary @"$f" "$UPLOAD?name=$f" | jq -r '"uploaded: \(.name // .message)"'
          done
