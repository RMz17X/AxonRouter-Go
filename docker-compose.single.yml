# AxonRouter-Go — single-node stack: one gateway + PostgreSQL 17.
#
#   cp .env.example .env   # set POSTGRES_PASSWORD and JWT_SECRET
#   docker compose -f docker-compose.single.yml up -d
#
# Upgrading from the SQLite era: put the legacy data.sqlite in
# ${LEGACY_DIR:-./legacy}/ and run the migrate profile BEFORE the first
# app boot against an existing database volume:
#   docker compose -f docker-compose.single.yml --profile migrate run --rm migrate
services:
  postgres:
    image: postgres:17
    # max_connections is set explicitly so the pool equation has both
    # sides in one file: APP_REPLICAS × PG_POOL_MAX_OPEN + 10 headroom
    # must stay ≤ PG_MAX_CONNECTIONS (see .env.example).
    command: postgres -c max_connections=${PG_MAX_CONNECTIONS:-100}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axonrouter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-axonrouter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axonrouter} -d ${POSTGRES_DB:-axonrouter}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    image: axonrouter-go:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Assembled from the POSTGRES_* parts so the password has one home (.env).
      DATABASE_URL: postgres://${POSTGRES_USER:-axonrouter}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-axonrouter}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:-}
      # Per-node PostgreSQL pool (code defaults 10/5). Keep
      # APP_REPLICAS × PG_POOL_MAX_OPEN + 10 ≤ PG_MAX_CONNECTIONS.
      PG_POOL_MAX_OPEN: ${PG_POOL_MAX_OPEN:-10}
      PG_POOL_MAX_IDLE: ${PG_POOL_MAX_IDLE:-5}
      PORT: "3177"
      DATA_DIR: /data
      # Container marker: disables the self-updater — updates are new
      # images, never an in-place binary swap (also set by the Dockerfile,
      # repeated here so the contract is visible in the stack file).
      AXONROUTER_IN_CONTAINER: "1"
      # Matches stop_grace_period below (P3 drain default is 30s).
      SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-30}
    ports:
      - "${PORT:-3177}:3177"
    volumes:
      # Non-DB state root: CLI tokens/machine-id, uploads, provider
      # instruction files, tunnel state, catalog cache. The database
      # itself lives in PostgreSQL, never in this volume (P4).
      - appdata:/data
    stop_grace_period: 30s
    restart: unless-stopped

  # One-shot SQLite → PostgreSQL migration (tools/migrate-db). Runs the
  # migrator's own verification: it refuses a non-empty target unless
  # --truncate is added to the command.
  migrate:
    profiles: ["migrate"]
    build:
      context: tools/migrate-db
    image: axonrouter-go-migrate:local
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # NOT read-only on purpose: the migrator opens the source with
      # SQLite mode=ro (the database file itself is never written —
      # checksum-verified), but a WAL-mode source needs a writable
      # directory for its -shm/-wal recovery sidecars; a :ro mount
      # fails the open with SQLITE_CANTOPEN.
      - ${LEGACY_DIR:-./legacy}:/legacy
    command:
      - --sqlite
      - /legacy/data.sqlite
      - --pg
      - postgres://${POSTGRES_USER:-axonrouter}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-axonrouter}?sslmode=disable

volumes:
  pgdata:
  appdata:
