# nginx load balancer for the cluster stack (docker-compose.cluster.yml).
# The upstream is resolved through Docker's embedded DNS via a variable,
# so replica changes are picked up without an nginx restart (the `resolve`
# upstream parameter is nginx Plus only).
server {
    listen 80;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $app_upstream app:20130;
        proxy_pass http://$app_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE streams (chat, realtime usage) must flush immediately and
        # may legitimately run for a long time.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
